<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERNETIC QR HUB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Press+Start+2P&display=swap');

        :root {
            --neon-blue: #00ffff;
            --neon-pink: #ff00ff;
            --dark-bg: #0a0a0c;
            --medium-bg: #16161a;
            --text-color: #e0e0e0;
        }

        body {
            font-family: 'Major Mono Display', monospace;
            background-color: var(--dark-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px; /* Margen para móviles */
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Fondo con rejilla Cyberpunk */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            background-color: var(--medium-bg);
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 15px var(--neon-blue);
            padding: 30px;
            border-radius: 5px;
            width: 100%;
            max-width: 500px;
            position: relative;
            z-index: 20;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--neon-blue);
            font-size: 1.2rem; /* Tamaño adaptable */
            line-height: 1.4;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 25px;
        }

        p {
            font-size: 0.9rem;
            margin-bottom: 30px;
            color: #888;
            letter-spacing: 1px;
        }

        .button-group {
            display: flex;
            flex-direction: column; /* Por defecto para móvil */
            gap: 20px;
        }

        .cyber-button {
            background-color: transparent;
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            padding: 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            text-decoration: none;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 5px var(--neon-pink);
            position: relative;
        }

        .cyber-button:active {
            background-color: var(--neon-pink);
            color: black;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .cyber-button small {
            display: block;
            margin-top: 10px;
            font-size: 0.5rem;
            opacity: 0.7;
        }

        /* --- MEDIA QUERY PARA PC --- */
        @media (min-width: 768px) {
            h1 { font-size: 1.8rem; }
            .button-group {
                flex-direction: row; /* En PC se ponen uno al lado del otro */
            }
            .cyber-button:hover {
                background-color: var(--neon-pink);
                color: black;
                box-shadow: 0 0 25px var(--neon-pink);
                transform: translateY(-5px);
            }
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            font-size: 0.6rem;
            color: var(--neon-blue);
            opacity: 0.5;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CYBER_QR SYSTEM</h1>
        <p>> ACCESO_AUTORIZADO<br>> SELECCIONE MÓDULO...</p>
        
        <div class="button-group">
            <a href="web1.html" class="cyber-button">
                GENERADOR
                <small>[ENCODE_DATA]</small>
            </a>
            <a href="web2.html" class="cyber-button">
                VISOR
                <small>[DECODE_DATA]</small>
            </a>
        </div>
    </div>

    <div class="footer-text">
        LINK_ESTABLISHED // ANDROID_COMPATIBLE
    </div>

</body>
</html>
