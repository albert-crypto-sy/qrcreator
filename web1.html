<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>QR Control Panel</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg: #191919; --ibg: #25485a; --txt: #ffffff; --acc: #ffb71e; }
        body { margin: 0; padding: 10px; background-color: var(--bg); font-family: sans-serif; transition: background 0.3s; color: var(--txt); overflow-x: hidden; }
        .main-bar { display: flex; gap: 8px; align-items: center; z-index: 10; position: relative; }
        input[type="text"] { background-color: var(--ibg); border: 1px solid rgba(255,255,255,0.1); color: var(--txt); padding: 8px 12px; border-radius: 6px; outline: none; flex-grow: 1; font-size: 14px; }
        .btn { background: var(--ibg); border: 1px solid rgba(255,255,255,0.1); color: var(--txt); padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; transition: 0.3s; }
        .btn:hover { border-color: var(--acc); }

        #configPanel { max-height: 0; overflow: hidden; transition: max-height 0.5s ease; background: #d3d3d3; color: #000; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        #configPanel.open { max-height: 900px; margin-top: 15px; padding: 15px; border: 1px solid rgba(0,0,0,0.1); }
        
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .config-section h2 { font-size: 11px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .color-circle { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .color-circle.active { border-color: #000; transform: scale(1.1); }
        
        label { display: block; font-size: 9px; opacity: 0.7; margin-bottom: 3px; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--acc); }
        
        .advanced-controls { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 15px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 8px; align-items: center; }
        .picker-group { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: bold; }
        input[type="color"] { border: none; width: 18px; height: 18px; cursor: pointer; background: none; }

        .reset-btn { grid-column: 1 / -1; border: none; padding: 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="main-bar">
        <input type="text" id="textInput" placeholder="URL o texto.........">
        <button class="btn" onclick="send()"><i data-lucide="send" style="width:18px"></i></button>
        <button class="btn" onclick="clearQR()"><i data-lucide="rotate-ccw" style="width:18px"></i></button>
        <button class="btn" onclick="toggleConfig()"><i data-lucide="settings" style="width:18px"></i></button>
    </div>

    <div id="configPanel">
        <div class="config-grid">
            <div class="config-section">
                <h2>Web 1 (Control)</h2>
                <label>Fondo Barra</label><div class="palette" data-target="w1_bg"></div>
                <label>Input</label><div class="palette" data-target="w1_ibg"></div>
                <label>Texto e Iconos</label><div class="palette" data-target="w1_txt"></div>
            </div>
            <div class="config-section">
                <h2>Web 2 (Visor)</h2>
                <label>Fondo Pantalla</label><div class="palette" data-target="w2_bg"></div>
                <label>Tamaño QR (px)</label><input type="range" id="qrSize" min="100" max="1000" oninput="save()">
                <label>Tamaño Logo (px)</label><input type="range" id="logoSize" min="30" max="1000" oninput="save()">
                <label>Logo PNG</label><input type="file" id="logoIn" accept="image/*" onchange="saveFile(this)" style="font-size: 9px; width: 100%;">
            </div>
            <div class="advanced-controls">
                <div class="picker-group"><span>Fondo Panel</span><input type="color" id="panelBgPicker" oninput="savePanelColors()"></div>
                <div class="picker-group"><span>Texto Panel</span><input type="color" id="panelTxtPicker" oninput="savePanelColors()"></div>
                <div class="picker-group"><span>Botón Reset</span><input type="color" id="btnResetPicker" oninput="savePanelColors()"></div>
            </div>
            <button class="reset-btn" id="resetBtn" onclick="reset()">RESTAURAR DEFAULTS</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const input = document.getElementById('textInput');
        const colors = [{hex: '#ffb71e'}, {hex: '#3d6b7d'}, {hex: '#25485a'}, {hex: '#ffffff'}, {hex: '#191919'}, {hex: '#e3dbd1'}, {hex: '#ef1726'}];
        let config = JSON.parse(localStorage.getItem('qrConfig')) || {
            w1_bg: "#191919", w1_ibg: "#25485a", w1_txt: "#ffffff", w2_bg: "#191919",
            qrSize: 300, logoSize: 100, panelBg: "#d3d3d3", panelTxt: "#000000", btnReset: "#ffb71e"
        };

        function toggleConfig() { document.getElementById('configPanel').classList.toggle('open'); }
        
        document.querySelectorAll('.palette').forEach(palette => {
            const target = palette.dataset.target;
            colors.forEach(color => {
                const circle = document.createElement('div');
                circle.className = 'color-circle';
                circle.style.backgroundColor = color.hex;
                circle.onclick = () => { config[target] = color.hex; save(); };
                palette.appendChild(circle);
            });
        });

        function savePanelColors() {
            config.panelBg = document.getElementById('panelBgPicker').value;
            config.panelTxt = document.getElementById('panelTxtPicker').value;
            config.btnReset = document.getElementById('btnResetPicker').value;
            save();
        }

        function save() {
            config.qrSize = document.getElementById('qrSize').value;
            config.logoSize = document.getElementById('logoSize').value;
            localStorage.setItem('qrConfig', JSON.stringify(config));
            apply();
        }

        function saveFile(input) {
            const reader = new FileReader();
            reader.onload = (e) => { localStorage.setItem('qrLogo', e.target.result); save(); };
            if(input.files[0]) reader.readAsDataURL(input.files[0]);
        }

        function apply() {
            document.body.style.setProperty('--bg', config.w1_bg);
            document.body.style.setProperty('--ibg', config.w1_ibg);
            document.body.style.setProperty('--txt', config.w1_txt);
            const p = document.getElementById('configPanel');
            p.style.background = config.panelBg;
            p.style.color = config.panelTxt;
            const rb = document.getElementById('resetBtn');
            rb.style.background = config.btnReset;
            rb.style.color = config.panelTxt; // El texto del botón usa el color de texto del panel
            document.getElementById('panelBgPicker').value = config.panelBg;
            document.getElementById('panelTxtPicker').value = config.panelTxt;
            document.getElementById('btnResetPicker').value = config.btnReset;
        }

        function send() { localStorage.setItem('qrData', input.value); }
        function clearQR() { input.value = ''; localStorage.removeItem('qrData'); send(); }
        function reset() { if(confirm("¿Resetear?")) { localStorage.clear(); location.reload(); } }
        input.addEventListener('keypress', (e) => e.key === 'Enter' && send());
        window.onload = apply;
    </script>
</body>
</html>
